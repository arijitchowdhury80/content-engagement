# Academy/academy-training -- academy.algolia.com redirects to a dashboard sign-in, so the only
# body an anonymous fetch can return is the sign-in page. An honest counted LOGIN_REQUIRED is the
# correct outcome; forcing an abstract out of a sign-in wall is the failure.
strategy: no_abstract
abstract_shape: none
language_policy: ignore
min_body_chars: 100000000        # unreachable on purpose: nothing here is enrichable today
abstract_span_count: [1, 3]
highlight_count: [3, 5]
duplicate_description_policy: no_abstract
judge_required: false
coverage_target_pct: 0.0
dead_page_markers: ["Sign in", "Log in to continue", "Anmelden"]
