# Nav furniture: blog-hub, product-hub, resource-hub, developer-hub, doc-hub, utility,
# contact-sales, careers, doc-changelog, doc-glossary.
#
# A hub page receiving NO abstract is a PASS, not a failure, and the packet must count it as
# such rather than as a gap. coverage_target_pct 0.0 is the honest target.
strategy: no_abstract
abstract_shape: none
language_policy: ignore
min_body_chars: 100000000
abstract_span_count: [1, 3]
highlight_count: [3, 5]
duplicate_description_policy: no_abstract
judge_required: false
coverage_target_pct: 0.0
minimum_review_sample: 5
