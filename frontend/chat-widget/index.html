<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Algolia chat widget — local harness</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:40px;background:#f7f8fb;color:#021046}
  h1{font-size:20px} pre{background:#fff;border:1px solid #e1e4ec;border-radius:8px;padding:12px;overflow:auto}
  .hint{color:#6b7280;max-width:60ch}
</style>
</head>
<body>
<h1>Algolia chat widget — local harness</h1>
<p class="hint">This page hosts the widget custom elements exactly the way the Jahia
custom-code block does. Fill in APP_ID / SEARCH_KEY / agent ids below to talk to Agent Studio.</p>
<pre id="boot">booting…</pre>

<!-- Local-only token-usage probe (token-telemetry.js). Must load before
     algolia-chat.js so the fetch wrapper is in place before the widget makes
     its first completions call. Not part of any shipped bundle, not present
     in the Jahia embed.

     Fill in an Agent Studio admin/logs-scoped key below (see agents/checks/*.mjs
     and .env.local for the ALGOLIA_ADMIN_API_KEY convention this mirrors). Never
     commit a real value here. -->
<script>window.__ALGOLIA_LOGS_API_KEY__ = "d7f297460329d79bc637f05b66651874";</script>
<script src="./token-telemetry.js"></script>

<!-- Theme MUST load before algolia-chat.js so the 'algolia' theme name is registered
     at upgrade time (see the header comment in algolia-chat-theme-algolia.js). -->
<script src="./algolia-chat-theme-algolia.js"></script>
<script src="./algolia-confidence-badge.js"></script>
<script src="./algolia-chat.js"></script>
<script src="./algolia-chat-tracker.js"></script>
<script src="./algolia-chat-engage.js"></script>
<script src="./algolia-chat-form-tool.js"></script>

<algolia-chat
  app-id="0EXRPAXB56"
  search-api-key="b5807cba5eaa2030b6095cd202e4b708"
  index-name="Algolia_Prod_Copy_Enhanced"
  agents='{
    "primary": {"id":"e2c8596a-4420-41d2-80bb-5cd4aaeffda6","label":"Algolia Assistant"},
    "specialists": [
      {"key":"product","id":"24b23e23-26a6-4f98-9019-44746e1eb7f0","label":"Product Specialist"},
      {"key":"developer","id":"cdac8765-5626-451a-87a0-f5a95aad7235","label":"Developer Specialist"},
      {"key":"evidence","id":"c735a57d-d64e-4c4f-bea2-857a608d5a52","label":"Customer Evidence"}
    ]
  }'
  brand-name="Algolia"
  product-title="Algolia Assistant"
  corpus-name="Algolia documentation, guides and API reference"
  disclaimer="Fully grounded - every answer cites its sources."
  canonical-base-url="https://www.algolia.com"
  theme="algolia"
  default-open-mode="docked"
  show-welcome="true"
  discovery-enabled="true"
  auto-engage="true"
  sample-questions-group-cap="0"
  >

  <algolia-chat-visitor cookie-name="_ALGOLIA" region="us"></algolia-chat-visitor>

  <algolia-chat-engage
    concierge-agent-id="0f290529-629a-48fe-9424-f93e5894d8f3"
    min-pages="2" delay-ms="3000" widget-timeout-ms="25000" greeting-ttl-ms="600000"
    style="display:none"></algolia-chat-engage>

  <algolia-chat-form tool-name="submit_lead_form" title="Get in touch"></algolia-chat-form>

  <!-- Confidence judges. mode="algolia" routes to Agent Studio agents; anything that
       is not "algolia" or "off" falls through to the external "hosted" path instead.
       agent-id is the root/Chief judge; the three <algolia-agent> children are the panel.
       IDs are the runtime binding recorded in OPERATING-CONTRACT.md. -->
  <algolia-chat-confidence mode="algolia" agent-id="4479f02f-d5d0-4fce-a875-dafda15de166">
    <algolia-agent role="skeptic"  agent-id="a4c3846b-e538-4c9c-8e39-1bb15a21f2c2"></algolia-agent>
    <algolia-agent role="referee"  agent-id="c43d7374-801a-4d0f-aa09-ca12830565c3"></algolia-agent>
    <algolia-agent role="advocate" agent-id="f14b8ddf-2285-422c-89e5-180d7fa0b3bf"></algolia-agent>
  </algolia-chat-confidence>
</algolia-chat>

<script>
  // Boot report: which elements upgraded, and whether credentials were supplied.
  addEventListener('load', () => setTimeout(() => {
    const tags = ['algolia-chat','algolia-chat-visitor','algolia-chat-engage',
                  'algolia-chat-person','algolia-chat-confidence','algolia-chat-form',
                  'algolia-agent','algolia-instant-search','algolia-confidence-badge'];
    const el = document.querySelector('algolia-chat');
    document.getElementById('boot').textContent = JSON.stringify({
      defined: Object.fromEntries(tags.map(t => [t, !!customElements.get(t)])),
      shadowRoot: !!el?.shadowRoot,
      shadowChildren: el?.shadowRoot?.children?.length ?? 0,
      credentialsLookReal: !el.getAttribute('app-id').startsWith('REPLACE'),
      trackerInstalled: !!window.__algoliaChat_trackerInstalled,
      engageInstalled: !!window.__algoliaChat_engageInstalled,
      trackerMethods: Object.keys(window.algoliaTracker || {}).sort()
    }, null, 2);
  }, 1200));
</script>
</body>
</html>
