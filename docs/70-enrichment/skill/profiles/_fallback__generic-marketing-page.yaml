# The small marketing tail: solution-page, industry-page, use-case, comparison, partner, trust,
# pricing, department-page, program, event, webinar, company, services, landing-page.
strategy: editorial
abstract_shape: editorial_summary
language_policy: must_match_record
min_body_chars: 700
abstract_span_count: [1, 3]
highlight_count: [3, 5]
coverage_target_pct: 0.70
forbidden_patterns:
  - "^(Start|Try) (free|now|today)"
  - "^(Book|Request) a demo"
  - "^Contact (us|sales)"
