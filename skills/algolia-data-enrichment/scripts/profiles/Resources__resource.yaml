# Resources/resource -- gated landing pages are common; form chrome must not become the abstract.
strategy: editorial
abstract_shape: resource_summary
language_policy: must_match_record
min_body_chars: 700
abstract_span_count: [1, 3]
highlight_count: [3, 5]
coverage_target_pct: 0.75
forbidden_patterns:
  - "^(Download|Get) (the|your) (free )?(guide|report|ebook|whitepaper)"
  - "^(First|Last) name$"
  - "^(Business|Work) email"
  - "^Fill (out|in) the form"
shell_markers: ["Loading resource"]
