# base.yaml -- every profile inherits from this and ships DELTAS ONLY.
#
# The numbers here are the ones a bounded probe may NOT change. The measured noise band on this
# corpus is +/-2 PASS at n=50, so a threshold tuned on a 25-record probe is a number invented to
# fit a sample. They move only on a full-slice census.

source: ""
page_type: ""

strategy: editorial
abstract_shape: editorial_summary

# The Blog ruling -- "de/fr serving English is acceptable" -- was measured at 100% of Blog and 0%
# of every other source. It is NOT the default. Every other source must prove the language before
# enrichment, not after.
language_policy: must_match_record

min_body_chars: 1200
abstract_span_count: [1, 3]
highlight_count: [3, 6]
max_span_distance: null          # null -> the 20,000-char structural limit in gates.py
duplicate_description_policy: ban
allowed_code_comments: false
allow_quotes: false
information_gain_minimum: 8

judge_required: true
judge_threshold: 0.0
human_review_after_attempts: 2

coverage_target_pct: 0.85
max_human_review_open_pct: 0.05
minimum_review_sample: 20
max_method_disagreement_pct: 0.10

allowed_terminal_verdicts:
  - DEAD_PAGE
  - SHELL_PAGE
  - LOGIN_REQUIRED
  - FETCH_FAILED
  - REDIRECT_CANONICAL
  - REDIRECT_UNINDEXED
  - NO_ABSTRACT_THIN
  - EXCLUDED

dead_page_markers: ["Page not found", "404 Not Found", "Seite nicht gefunden", "Page introuvable"]
shell_markers: []
forbidden_patterns: []
