# Documentation is definitive technical content. It is audited for complete taxonomy and
# metadata, never expanded by an LLM. No abstract or key highlights may be written.
strategy: no_abstract
abstract_shape: none
language_policy: must_match_record
# LOW ON PURPOSE. A terse API reference page is legitimately short and is not a dead page.
# Reusing Blog's 1,200 floor here would quarantine correct pages en masse.
min_body_chars: 250
abstract_span_count: [1, 3]
# SDK method pages can honestly expose one material constraint (for example, deprecation,
# required key, or timing semantics). Requiring three turns a grounded one-fact page into THIN
# or tempts the selector toward code. Validated against the Scout-only doc-sdk smoke run a02.
highlight_count: [1, 3]
max_span_distance: 12000        # reference prose is interleaved with code blocks
allowed_code_comments: false
duplicate_description_policy: no_abstract
# On an API page the title IS the endpoint name and the description IS what it does, so a
# faithful abstract necessarily repeats them. Measured on 16 such failures the gains were
# 0,0,0,1,1,2,3,3,3,4,4,6,6,6,7,7: a bar of 3 recovers 10 and still rejects 0/1/2.
information_gain_minimum: 3
judge_required: false
coverage_target_pct: 0.0
minimum_review_sample: 25
forbidden_patterns:
  - "^(Parameters|Returns|Response|Example|Usage|Signature)$"
  - "^(GET|POST|PUT|DELETE|PATCH) /"
  - "^(import|const|from|require|package|using) "
  - "^See (also )?the .* (guide|reference|documentation)"
  - "^(Was this page helpful|On this page|Edit this page)"
dead_page_markers: ["Page not found", "This page has moved"]
shell_markers: ["Loading documentation", "doc-index"]
