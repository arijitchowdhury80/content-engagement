# Exempts this module's action from Jahia's CSRF Guard, since it's called by
# plain JS fetch() from outside a Jahia-rendered page context (no CSRF token
# available). Packaged in the module so it applies automatically on deploy —
# see https://academy.jahia.com/documentation/knowledge-base/csrf-error-on-custom-action
whitelist = *.algoliaTokenTelemetry.do
